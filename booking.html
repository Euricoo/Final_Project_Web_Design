<html>
    <head>
        <title>Booking Kos - TeWoKos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bangers&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,900&family=Rubik+Mono+One&family=Special+Elite&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="halaman-form">
        <h1 class="text-center tw-logo" aria-label="TeWoKos"><span aria-hidden="true">T</span><span aria-hidden="true">e</span><span aria-hidden="true">W</span><span aria-hidden="true">o</span><span aria-hidden="true">K</span><span aria-hidden="true">o</span><span aria-hidden="true">s</span></h1>

        <nav class="navbar navbar-expand-md">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Buka menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Beranda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="peta_kos.html">Peta Kos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="loginpemilikkos.html">Pemilik Kos</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Menu</a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="booking.html">Booking</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="favorit.html">Kos Favorit</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex gap-2" role="search" action="index.html#kos">
                        <input class="form-control" type="search" name="q" placeholder="Cari kos" aria-label="Cari kos">
                        <button class="btn btn-primary" type="submit">Cari</button>
                    </form>
                </div>
            </div>
        </nav>

        <main class="container py-4">
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card">
                        <div class="card-body p-4">
                            <h2 class="h3">Booking Kos</h2>
                            <p class="text-body-secondary">Isi data penyewa dengan lengkap.</p>
                            <form action="booking_sukses.html">
                                <div class="mb-3">
                                    <label for="kos" class="form-label">Nama Kos</label>
                                    <select id="kos" name="kos" class="form-select">
                                        <option>Kos Metta</option>
                                        <option disabled>Kos Menorah (penuh)</option>
                                        <option>Kos Essy</option>
                                        <option>Kos Pumorrow Indah</option>
                                        <option>Kos Inayah</option>
                                        <option>Kos Ozora</option>
                                        <option>Kos Pink</option>
                                        <option disabled>Kos J28 Unklab (penuh)</option>
                                        <option>Kos Herman Maringka</option>
                                        <option>Kos Chiko</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="nama" class="form-label">Nama Lengkap</label>
                                    <input type="text" id="nama" name="nama" class="form-control" required placeholder="Nama lengkap Anda">
                                </div>
                                <div class="mb-3">
                                    <label for="noWa" class="form-label">Nomor WhatsApp</label>
                                    <input type="tel" id="noWa" name="noWa" class="form-control" required placeholder="08xxxxxxxxxx">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" required placeholder="nama@contoh.com">
                                </div>
                                <div class="mb-3">
                                    <label for="tanggalMasuk" class="form-label">Tanggal Masuk</label>
                                    <input type="date" id="tanggalMasuk" name="tanggalMasuk" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="gender" class="form-label">Jenis Kelamin</label>
                                    <select id="gender" name="gender" class="form-select">
                                        <option>Laki-laki</option>
                                        <option>Perempuan</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="lama" class="form-label">Lama Sewa</label>
                                    <select id="lama" name="lama" class="form-select">
                                        <option>1 bulan</option>
                                        <option>3 bulan</option>
                                        <option>6 bulan</option>
                                        <option>12 bulan</option>
                                    </select>
                                    <div class="form-text">Total biaya = harga per bulan x lama sewa. <a href="#biaya">Lihat tabel biaya sewa</a></div>
                                </div>
                                <div class="mb-3">
                                    <label for="bayar" class="form-label">Metode Pembayaran</label>
                                    <select id="bayar" name="bayar" class="form-select">
                                        <option>Transfer bank</option>
                                        <option>E-wallet</option>
                                        <option>Bayar di tempat</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="catatan" class="form-label">Catatan untuk Pemilik</label>
                                    <textarea id="catatan" name="catatan" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="bukti" class="form-label">Bukti Pembayaran</label>
                                    <input type="file" id="bukti" name="bukti" class="form-control" accept="image/*,.pdf">
                                </div>
                                <div class="form-text mb-3">Wajib untuk transfer bank dan e-wallet.</div>
                                <button type="submit" class="btn btn-primary w-100">Booking</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
