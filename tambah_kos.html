
<html>
    <head>
        <title>Tambah Kos - TeWoKos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bangers&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,900&family=Rubik+Mono+One&family=Special+Elite&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="halaman-form">
        <nav class="navbar navbar-expand">
            <div class="container-fluid">
                <a class="navbar-brand tw-logo" href="dashboard_pemilik.html" aria-label="TeWoKos"><span aria-hidden="true">T</span><span aria-hidden="true">e</span><span aria-hidden="true">W</span><span aria-hidden="true">o</span><span aria-hidden="true">K</span><span aria-hidden="true">o</span><span aria-hidden="true">s</span></a>
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard_pemilik.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tambah_kos.html">Tambah Kos</a>
                    </li>
                </ul>
                <a href="loginpemilikkos.html" class="btn btn-outline-secondary btn-sm">Keluar</a>
            </div>
        </nav>

        <main class="container py-4">
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card">
                        <div class="card-body p-4">
                            <h2 class="h3 mb-3">Tambah / Ubah Kos</h2>
                            <form action="dashboard_pemilik.html">
                                <div class="mb-3">
                                    <label for="nama" class="form-label">Nama Kos</label>
                                    <input type="text" id="nama" name="nama" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="tipe" class="form-label">Tipe Kos</label>
                                    <select id="tipe" name="tipe" class="form-select">
                                        <option>Putra</option>
                                        <option>Putri</option>
                                        <option>Campur</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="harga" class="form-label">Harga per Bulan (Rp)</label>
                                    <input type="number" id="harga" name="harga" class="form-control" required min="0">
                                </div>
                                <div class="mb-3">
                                    <label for="kamar" class="form-label">Jumlah Kamar Kosong</label>
                                    <input type="number" id="kamar" name="kamar" class="form-control" required min="0">
                                </div>
                                <div class="mb-3">
                                    <label for="lokasi" class="form-label">Alamat / Lokasi</label>
                                    <input type="text" id="lokasi" name="lokasi" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="deskripsi" class="form-label">Deskripsi</label>
                                    <textarea id="deskripsi" name="deskripsi" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block">Fasilitas</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="AC" id="f0">
                                        <label class="form-check-label" for="f0">AC</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="WiFi" id="f1">
                                        <label class="form-check-label" for="f1">WiFi</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="Kamar mandi dalam" id="f2">
                                        <label class="form-check-label" for="f2">Kamar mandi dalam</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="Parkir motor" id="f3">
                                        <label class="form-check-label" for="f3">Parkir motor</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="Dapur bersama" id="f4">
                                        <label class="form-check-label" for="f4">Dapur bersama</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="fasilitas" value="CCTV" id="f5">
                                        <label class="form-check-label" for="f5">CCTV</label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="foto" class="form-label">Foto Kos</label>
                                    <input type="file" id="foto" name="foto" class="form-control" accept="image/*" multiple>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">Simpan</button>
                                    <a href="dashboard_pemilik.html" class="btn btn-outline-secondary">Batal</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
