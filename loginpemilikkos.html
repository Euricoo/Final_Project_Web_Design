
<html>
    <head>
        <title>Login Pemilik Kos - TeWoKos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="container min-vh-100 d-flex align-items-center">
            <div class="row w-100 justify-content-center">
                <div class="col-11 col-sm-8 col-md-5 col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title text-center mb-3">Login Pemilik Kos</h5>
                            <form action="dashboard_pemilik.html">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" name="email" class="form-control" required placeholder="nama@contoh.com">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Kata Sandi</label>
                                    <input type="password" id="password" name="password" class="form-control" required minlength="8" maxlength="20">
                                </div>
                                <div class="form-text mb-3">Panjang 8-20 karakter.</div>
                                <button type="submit" class="btn btn-primary w-100">Masuk</button>
                                <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Kembali ke Beranda</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
