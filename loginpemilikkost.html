<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <title>Login</title>
    </head>

    <body class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="card text-center" style="width: 19rem;">
            <div class="card-body">
                <h5 class="card-title">Login Pemilik Kost</h5>

                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label for="inputPassword6" class="form-label">Password</label>
                    <input type="password" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
                    <span id="passwordHelpInline" class="form-text">Must be 8-20 characters long.</span>
                </div>

                <a href="dashboard_pemilik.html" class="btn btn-primary w-100">Login</a>
                <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Kembali ke Beranda</a>
            </div>
        </div>
    </body>
</html>
